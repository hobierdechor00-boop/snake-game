<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game Pro</title>
  <style>
    :root {
      --bg: #0a0e27;
      --bg-light: #1a1f3a;
      --snake-head: #00ff66;
      --snake-body: #7ef0a1;
      --food: #ff4d4d;
      --food-light: #ff8a8a;
      --obstacle: #ff9500;
      --accent: #00aa55;
      --danger: #ff5555;
      --text: #fff;
      --text-dim: #aaa;
      --text-light: #ddd;
      --overlay: rgba(10, 14, 39, 0.92);
      --border-radius: 16px;
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background: linear-gradient(135deg, var(--bg) 0%, #1a1f3a 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: clamp(8px, 3vw, 16px);
      padding: clamp(10px, 4vw, 20px);
      touch-action: none;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, #0a0e27, #1a1f3a, #0f1428, #1a1f3a);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      z-index: -2;
      opacity: 0.5;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 80%, rgba(0, 255, 102, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 77, 77, 0.06) 0%, transparent 50%);
      z-index: -1;
      pointer-events: none;
      animation: pulse 8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.5; }
    }

    .header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(6px, 2vw, 12px);
      z-index: 10;
      animation: slideDown 0.4s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      color: var(--snake-head);
      font-size: clamp(1.5rem, 6vw, 2.8rem);
      font-weight: 800;
      text-align: center;
      text-shadow: 0 0 30px rgba(0, 255, 102, 0.4),
                   0 0 60px rgba(0, 255, 102, 0.2);
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: clamp(0.75rem, 2vw, 0.95rem);
      text-align: center;
      font-weight: 500;
      opacity: 0.8;
    }

    .hud {
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      justify-content: center;
      width: 100%;
      max-width: 500px;
      gap: clamp(8px, 2vw, 12px);
      z-index: 10;
      animation: slideDown 0.5s ease;
    }

    .hud-stats {
      display: flex;
      gap: clamp(8px, 2vw, 16px);
      align-items: center;
      justify-content: center;
      flex: 1;
      min-width: 200px;
      padding: clamp(8px, 2vw, 14px);
      background: rgba(26, 31, 58, 0.6);
      border-radius: var(--border-radius);
      border: 1px solid rgba(0, 255, 102, 0.2);
      backdrop-filter: blur(10px);
      transition: all var(--transition);
    }

    .hud-stats:hover {
      border-color: rgba(0, 255, 102, 0.4);
      background: rgba(26, 31, 58, 0.8);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(2px, 1vw, 4px);
      flex: 1;
    }

    .stat-label {
      font-size: clamp(0.7rem, 1.5vw, 0.85rem);
      color: var(--text-dim);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: clamp(1rem, 3vw, 1.4rem);
      font-weight: bold;
      color: var(--snake-head);
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
    }

    .stat-icon {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      margin-bottom: 2px;
    }

    .hud-controls {
      display: flex;
      gap: clamp(6px, 1.5vw, 10px);
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .action-btn {
      border: 1px solid rgba(0, 255, 102, 0.3);
      border-radius: 10px;
      background: rgba(51, 51, 51, 0.7);
      color: white;
      cursor: pointer;
      padding: clamp(8px, 2vw, 12px) clamp(12px, 2.5vw, 18px);
      font-size: clamp(0.8rem, 2vw, 0.95rem);
      font-weight: 600;
      transition: all var(--transition);
      backdrop-filter: blur(10px);
      white-space: nowrap;
      user-select: none;
      touch-action: manipulation;
    }

    .action-btn:active {
      transform: scale(0.95);
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(0, 170, 85, 0.4);
    }

    .action-btn:hover {
      background: rgba(51, 51, 51, 0.9);
      border-color: rgba(0, 255, 102, 0.5);
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(12px, 3vw, 16px);
      width: 100%;
      z-index: 10;
      animation: slideUp 0.5s ease 0.1s both;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .game-shell {
      position: relative;
      width: min(92vw, 95vmax, 450px);
      aspect-ratio: 1;
      z-index: 10;
      border-radius: var(--border-radius);
      box-shadow: 
        0 0 50px rgba(0, 255, 102, 0.15),
        inset 0 0 30px rgba(0, 255, 102, 0.05),
        0 10px 40px rgba(0, 0, 0, 0.3);
      transition: all var(--transition);
    }

    .game-shell:hover {
      box-shadow: 
        0 0 60px rgba(0, 255, 102, 0.25),
        inset 0 0 40px rgba(0, 255, 102, 0.08),
        0 15px 50px rgba(0, 0, 0, 0.4);
    }

    canvas {
      display: block;
      background: #0f1428;
      border: 3px solid var(--snake-head);
      width: 100%;
      height: 100%;
      border-radius: var(--border-radius);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: var(--overlay);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: var(--border-radius);
      padding: clamp(16px, 4vw, 32px);
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
      border: 2px solid rgba(0, 255, 102, 0.2);
      z-index: 20;
      overflow-y: auto;
      max-height: 100%;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 2vw, 16px);
      max-width: 90%;
    }

    .overlay-title {
      font-size: clamp(1.5rem, 4vw, 2.4rem);
      font-weight: 800;
      margin: 0;
      color: var(--snake-head);
      text-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
      line-height: 1.2;
    }

    .overlay-subtitle {
      font-size: clamp(0.85rem, 2vw, 0.95rem);
      color: var(--text-dim);
      line-height: 1.6;
      max-width: 300px;
      font-weight: 500;
    }

    .overlay-stats {
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.5vw, 12px);
      width: 100%;
      max-width: 280px;
      margin: clamp(8px, 2vw, 12px) 0;
    }

    .overlay-stat {
      display: flex;
      justify-content: space-between;
      gap: clamp(16px, 4vw, 30px);
      padding: clamp(8px, 1.5vw, 12px);
      background: rgba(0, 255, 102, 0.08);
      border-radius: 10px;
      border-left: 3px solid var(--accent);
    }

    .overlay-stat span {
      font-size: clamp(0.85rem, 2vw, 0.95rem);
      color: var(--text-dim);
      font-weight: 600;
    }

    .overlay-stat strong {
      font-size: clamp(0.85rem, 2vw, 0.95rem);
      color: var(--snake-head);
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.3);
    }

    .overlay button {
      background: linear-gradient(135deg, var(--accent) 0%, #00cc77 100%);
      color: white;
      border: none;
      border-radius: 12px;
      width: clamp(150px, 70vw, 200px);
      padding: clamp(10px, 2vw, 16px);
      font-size: clamp(0.95rem, 2.5vw, 1.1rem);
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: 0 4px 15px rgba(0, 170, 85, 0.3);
      user-select: none;
      touch-action: manipulation;
    }

    .overlay button:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(0, 170, 85, 0.2);
    }

    .overlay button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 170, 85, 0.4);
    }

    #message {
      min-height: clamp(24px, 4vw, 32px);
      font-size: clamp(0.95rem, 2.5vw, 1.3rem);
      color: var(--danger);
      font-weight: 700;
      text-align: center;
      text-shadow: 0 0 10px rgba(255, 85, 85, 0.3);
      animation: fadeInOut 2s ease-in-out;
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 3vw, 16px);
      width: 100%;
      max-width: 500px;
      z-index: 10;
      padding: clamp(10px, 2vw, 16px);
      animation: slideUp 0.5s ease 0.2s both;
    }

    .controls-title {
      font-size: clamp(0.75rem, 1.5vw, 0.85rem);
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .row {
      display: flex;
      gap: clamp(10px, 2vw, 16px);
      justify-content: center;
      flex-wrap: wrap;
    }

    button.dir-btn {
      width: clamp(60px, 14vw, 80px);
      height: clamp(60px, 14vw, 80px);
      border: 2px solid rgba(0, 255, 102, 0.4);
      border-radius: 16px;
      background: rgba(51, 51, 51, 0.8);
      color: white;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      cursor: pointer;
      user-select: none;
      transition: all var(--transition);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    button.dir-btn:hover {
      border-color: rgba(0, 255, 102, 0.7);
      background: rgba(51, 51, 51, 0.95);
      box-shadow: 0 6px 20px rgba(0, 255, 102, 0.2);
    }

    button.dir-btn:active {
      transform: scale(0.92);
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(0, 170, 85, 0.3);
    }

    #restart {
      width: clamp(140px, 60vw, 200px);
      padding: clamp(10px, 2vw, 14px);
      font-size: clamp(0.95rem, 2.5vw, 1.1rem);
      background: linear-gradient(135deg, var(--accent) 0%, #00cc77 100%);
      border: none;
      color: white;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: 0 4px 15px rgba(0, 170, 85, 0.3);
      user-select: none;
      touch-action: manipulation;
    }

    #restart:active {
      transform: scale(0.97);
    }

    #restart:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 170, 85, 0.4);
    }

    @media (min-width: 600px) {
      body {
        justify-content: center;
        padding-bottom: 40px;
      }

      .hud {
        gap: 16px;
      }

      .hud-stats {
        min-width: 250px;
      }

      button.dir-btn:hover {
        transform: translateY(-3px);
      }

      button.dir-btn:active {
        transform: scale(0.92);
      }
    }

    @media (max-width: 380px) {
      h1 {
        font-size: 1.4rem;
      }

      .hud {
        gap: 10px;
      }

      .hud-stats {
        flex-direction: row;
        gap: 10px;
      }

      .stat-item {
        flex: 0.5;
      }

      .row {
        gap: 8px;
      }

      button.dir-btn {
        width: 58px;
        height: 58px;
        font-size: 1.3rem;
      }

      .hud-controls {
        gap: 6px;
      }

      .action-btn {
        padding: 8px 10px;
        font-size: 0.8rem;
      }
    }

    @media (max-height: 600px) and (orientation: landscape) {
      body {
        gap: 8px;
        padding: 8px;
      }

      .header {
        gap: 4px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .subtitle {
        display: none;
      }

      .game-shell {
        width: min(90vh, 90vw);
        aspect-ratio: 1;
        max-width: 400px;
      }

      .controls {
        gap: 8px;
      }

      button.dir-btn {
        width: 50px;
        height: 50px;
        font-size: 1.2rem;
      }

      .row {
        gap: 8px;
      }

      #restart {
        width: auto;
        padding: 6px 12px;
        font-size: 0.9rem;
      }
    }

    @media (hover: none) and (pointer: coarse) {
      button {
        min-height: 44px;
        min-width: 44px;
      }

      .action-btn {
        min-height: 44px;
      }

      button.dir-btn {
        min-height: 60px;
        min-width: 60px;
      }

      button:active {
        opacity: 0.8;
      }
    }

    @media print {
      body::before,
      body::after,
      .hud-controls,
      .controls,
      #restart {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🐍 Snake Pro</h1>
    <div class="subtitle">Master the snake, beat the levels</div>
  </div>

  <div class="hud">
    <div class="hud-stats">
      <div class="stat-item">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div style="width: 1px; background: rgba(0, 255, 102, 0.2);"></div>
      <div class="stat-item">
        <div class="stat-label">Level</div>
        <div class="stat-value" id="levelNum">1</div>
      </div>
      <div style="width: 1px; background: rgba(0, 255, 102, 0.2);"></div>
      <div class="stat-item">
        <div class="stat-icon">📊</div>
        <div class="stat-label" id="levelName">Easy Street</div>
      </div>
    </div>

    <div class="hud-controls">
      <button id="startBtn" class="action-btn">▶ Start</button>
      <button id="pauseBtn" class="action-btn">⏸ Pause</button>
    </div>
  </div>

  <div class="game-container">
    <div class="game-shell">
      <canvas id="game" width="400" height="400"></canvas>

      <div id="overlay" class="overlay">
        <div class="overlay-content">
          <div class="overlay-title">Ready?</div>
          <div class="overlay-subtitle">Navigate the snake, eat food, avoid walls and obstacles.</div>
          <button id="overlayStartBtn">Start Game</button>
        </div>
      </div>
    </div>

    <div id="message"></div>
  </div>

  <div class="controls">
    <div class="controls-title">Direction Controls</div>
    <button id="up" class="dir-btn" aria-label="Move up">⬆️</button>

    <div class="row">
      <button id="left" class="dir-btn" aria-label="Move left">⬅️</button>
      <button id="down" class="dir-btn" aria-label="Move down">⬇️</button>
      <button id="right" class="dir-btn" aria-label="Move right">➡️</button>
    </div>
  </div>

  <button id="restart" aria-label="Restart game">🔄 Restart</button>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const levelNumEl = document.getElementById("levelNum");
    const levelNameEl = document.getElementById("levelName");
    const messageEl = document.getElementById("message");
    const overlayEl = document.getElementById("overlay");
    const overlayTitleEl = overlayEl.querySelector(".overlay-title");
    const overlaySubtitleEl = overlayEl.querySelector(".overlay-subtitle");
    const overlayStartBtn = document.getElementById("overlayStartBtn");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");

    const box = 20;
    const gridSize = canvas.width / box;
    const directionMap = {
      UP: { x: 0, y: -1 },
      DOWN: { x: 0, y: 1 },
      LEFT: { x: -1, y: 0 },
      RIGHT: { x: 1, y: 0 }
    };

    const levels = [
      {
        name: "Easy Street",
        speed: 130,
        obstacles: [],
        foodCount: 1
      },
      {
        name: "Tricky Path",
        speed: 110,
        obstacles: [
          { x: 5, y: 5, w: 3, h: 3 },
          { x: 15, y: 15, w: 3, h: 3 }
        ],
        foodCount: 1
      },
      {
        name: "Maze Runner",
        speed: 90,
        obstacles: [
          { x: 8, y: 3, w: 5, h: 2 },
          { x: 12, y: 8, w: 2, h: 5 },
          { x: 3, y: 12, w: 6, h: 2 },
          { x: 15, y: 15, w: 2, h: 3 }
        ],
        foodCount: 1
      },
      {
        name: "Chaos",
        speed: 70,
        obstacles: [
          { x: 5, y: 5, w: 3, h: 3 },
          { x: 12, y: 5, w: 3, h: 3 },
          { x: 5, y: 12, w: 3, h: 3 },
          { x: 12, y: 12, w: 3, h: 3 },
          { x: 9, y: 9, w: 2, h: 2 }
        ],
        foodCount: 2
      }
    ];

    let snake = [];
    let food = [];
    let obstacles = [];
    let direction = "RIGHT";
    let nextDirection = "RIGHT";
    let score = 0;
    let level = 0;
    let isStarted = false;
    let isPaused = false;
    let isGameOver = false;
    let lastTimestamp = 0;
    let accumulator = 0;
    let moveInterval = 130;

    function getCurrentLevel() {
      return levels[Math.min(level, levels.length - 1)];
    }

    function initLevel() {
      const levelData = getCurrentLevel();
      obstacles = levelData.obstacles.map(obs => ({
        ...obs,
        cells: generateObstacleCells(obs)
      }));

      food = [];
      for (let i = 0; i < levelData.foodCount; i++) {
        food.push(randomFood());
      }

      moveInterval = levelData.speed;
    }

    function generateObstacleCells(obs) {
      const cells = [];
      for (let x = obs.x; x < obs.x + obs.w; x++) {
        for (let y = obs.y; y < obs.y + obs.h; y++) {
          cells.push({ x: x * box, y: y * box });
        }
      }
      return cells;
    }

    function randomFood() {
      let newFood;
      do {
        newFood = {
          x: Math.floor(Math.random() * gridSize) * box,
          y: Math.floor(Math.random() * gridSize) * box
        };
      } while (
        snake.some(s => sameCell(s, newFood)) ||
        food.some(f => sameCell(f, newFood)) ||
        isInObstacle(newFood)
      );
      return newFood;
    }

    function isInObstacle(pos) {
      return obstacles.some(obs =>
        obs.cells.some(cell => sameCell(cell, pos))
      );
    }

    function updateScore() {
      scoreEl.textContent = score;
      levelNumEl.textContent = level + 1;
      levelNameEl.textContent = getCurrentLevel().name;
    }

    function setOverlay(title, subtitle, buttonText) {
      overlayTitleEl.textContent = title;
      overlaySubtitleEl.textContent = subtitle;
      overlayStartBtn.textContent = buttonText;

      const statsEl = overlayEl.querySelector(".overlay-stats");
      if (statsEl) statsEl.remove();
    }

    function showOverlay() {
      overlayEl.classList.remove("hidden");
    }

    function hideOverlay() {
      overlayEl.classList.add("hidden");
    }

    function resetGame() {
      snake = [
        { x: 10 * box, y: 10 * box },
        { x: 9 * box, y: 10 * box },
        { x: 8 * box, y: 10 * box }
      ];
      direction = "RIGHT";
      nextDirection = "RIGHT";
      score = 0;
      level = 0;
      isGameOver = false;
      isPaused = false;
      accumulator = 0;
      lastTimestamp = 0;

      initLevel();
      updateScore();
      messageEl.textContent = "";
      pauseBtn.textContent = "⏸ Pause";
      setOverlay(
        "Ready?",
        "Navigate the snake, eat food, avoid walls and obstacles.",
        "Start Game"
      );
      showOverlay();
    }

    function startGame() {
      if (isGameOver) {
        resetGame();
      }

      isStarted = true;
      isPaused = false;
      pauseBtn.textContent = "⏸ Pause";
      startBtn.textContent = "▶ Start";
      messageEl.textContent = "";
      hideOverlay();
    }

    function togglePause() {
      if (!isStarted || isGameOver) return;

      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? "▶ Resume" : "⏸ Pause";

      if (isPaused) {
        setOverlay("Paused", "Press Resume or tap Space to continue.", "▶ Resume");
        showOverlay();
      } else {
        hideOverlay();
      }
    }

    function nextLevel() {
      level++;
      initLevel();
      updateScore();
      messageEl.textContent = `✨ Level ${level + 1}!`;
      setTimeout(() => {
        messageEl.textContent = "";
      }, 2000);
    }

    function sameCell(a, b) {
      return a.x === b.x && a.y === b.y;
    }

    function setDirection(newDirection) {
      const current = directionMap[direction];
      const next = directionMap[newDirection];

      const isOpposite =
        current.x + next.x === 0 &&
        current.y + next.y === 0;

      if (!isOpposite) {
        nextDirection = newDirection;
      }
    }

    function updateGame() {
      direction = nextDirection;
      const move = directionMap[direction];

      const head = snake[0];
      const newHead = {
        x: head.x + move.x * box,
        y: head.y + move.y * box
      };

      if (
        newHead.x < 0 ||
        newHead.y < 0 ||
        newHead.x >= canvas.width ||
        newHead.y >= canvas.height ||
        isInObstacle(newHead)
      ) {
        endGame();
        return;
      }

      const bodyToCheck = food.some(f => sameCell(newHead, f))
        ? snake
        : snake.slice(0, -1);

      if (bodyToCheck.some(segment => sameCell(newHead, segment))) {
        endGame();
        return;
      }

      snake.unshift(newHead);

      let ateFood = false;
      for (let i = 0; i < food.length; i++) {
        if (sameCell(newHead, food[i])) {
          score++;
          updateScore();
          food[i] = randomFood();
          ateFood = true;
          break;
        }
      }

      if (!ateFood) {
        snake.pop();
      }

      if (score > 0 && score % 5 === 0 && score / 5 === level + 1) {
        nextLevel();
      }
    }

    function endGame() {
      isGameOver = true;
      isStarted = false;
      messageEl.textContent = "💀 Game Over!";

      setOverlay(
        "Game Over",
        `You reached Level ${level + 1} • Score: ${score}`,
        "Play Again"
      );
      showOverlay();
    }

    function drawBackground() {
      ctx.fillStyle = "#0f1428";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(0, 255, 102, 0.05)";
      ctx.lineWidth = 1;

      for (let i = 0; i <= gridSize; i++) {
        ctx.beginPath();
        ctx.moveTo(i * box, 0);
        ctx.lineTo(i * box, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * box);
        ctx.lineTo(canvas.width, i * box);
        ctx.stroke();
      }
    }

    function drawObstacles() {
      obstacles.forEach(obs => {
        const gradient = ctx.createLinearGradient(
          obs.x * box,
          obs.y * box,
          obs.x * box + obs.w * box,
          obs.y * box + obs.h * box
        );
        gradient.addColorStop(0, "#ff9500");
        gradient.addColorStop(1, "#ff6b00");

        ctx.fillStyle = gradient;
        ctx.fillRect(obs.x * box, obs.y * box, obs.w * box, obs.h * box);

        ctx.strokeStyle = "#ffaa00";
        ctx.lineWidth = 2;
        ctx.strokeRect(obs.x * box, obs.y * box, obs.w * box, obs.h * box);
      });
    }

    function drawFood() {
      food.forEach(f => {
        ctx.save();
        ctx.translate(f.x + box / 2, f.y + box / 2);
        ctx.rotate((Date.now() / 1000) * Math.PI);

        ctx.fillStyle = "#ff4d4d";
        ctx.fillRect(-box / 2, -box / 2, box, box);

        ctx.fillStyle = "#ff8a8a";
        ctx.fillRect(-box / 2 + 4, -box / 2 + 4, box - 8, box - 8);

        ctx.restore();
      });
    }

    function drawSnake() {
      snake.forEach((segment, index) => {
        const isHead = index === 0;

        ctx.save();

        if (isHead) {
          ctx.shadowColor = "rgba(0, 255, 102, 0.5)";
          ctx.shadowBlur = 12;
        }

        ctx.fillStyle = isHead ? "#00ff66" : "#7ef0a1";
        ctx.fillRect(segment.x, segment.y, box, box);

        ctx.strokeStyle = isHead ? "#00dd55" : "#66ff99";
        ctx.lineWidth = 2;
        ctx.strokeRect(segment.x, segment.y, box, box);

        if (isHead) {
          ctx.fillStyle = "#111";

          if (direction === "LEFT") {
            ctx.fillRect(segment.x + 3, segment.y + 5, 3, 3);
            ctx.fillRect(segment.x + 3, segment.y + 12, 3, 3);
          } else if (direction === "RIGHT") {
            ctx.fillRect(segment.x + box - 6, segment.y + 5, 3, 3);
            ctx.fillRect(segment.x + box - 6, segment.y + 12, 3, 3);
          } else if (direction === "UP") {
            ctx.fillRect(segment.x + 5, segment.y + 3, 3, 3);
            ctx.fillRect(segment.x + 12, segment.y + 3, 3, 3);
          } else if (direction === "DOWN") {
            ctx.fillRect(segment.x + 5, segment.y + box - 6, 3, 3);
            ctx.fillRect(segment.x + 12, segment.y + box - 6, 3, 3);
          }
        }

        ctx.restore();
      });
    }

    function render() {
      drawBackground();
      drawObstacles();
      drawFood();
      drawSnake();
    }

    function gameLoop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;

      const delta = timestamp - lastTimestamp;
      lastTimestamp = timestamp;

      if (isStarted && !isPaused && !isGameOver) {
        accumulator += delta;

        while (accumulator >= moveInterval) {
          updateGame();
          accumulator -= moveInterval;
        }
      }

      render();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", (event) => {
      const key = event.key;

      if (key === "ArrowUp" || key.toLowerCase() === "w") {
        setDirection("UP");
      } else if (key === "ArrowDown" || key.toLowerCase() === "s") {
        setDirection("DOWN");
      } else if (key === "ArrowLeft" || key.toLowerCase() === "a") {
        setDirection("LEFT");
      } else if (key === "ArrowRight" || key.toLowerCase() === "d") {
        setDirection("RIGHT");
      } else if (key === " ") {
        event.preventDefault();
        if (isStarted && !isGameOver) {
          togglePause();
        }
      }
    });

    ["up", "down", "left", "right"].forEach(id => {
      const btn = document.getElementById(id);

      btn.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        setDirection(id.toUpperCase());
      });

      btn.addEventListener("click", (event) => {
        event.preventDefault();
        setDirection(id.toUpperCase());
      });
    });

    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener("touchstart", (event) => {
      const touch = event.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: true });

    canvas.addEventListener("touchend", (event) => {
      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStartX;
      const dy = touch.clientY - touchStartY;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0) setDirection("RIGHT");
        else setDirection("LEFT");
      } else {
        if (dy > 0) setDirection("DOWN");
        else setDirection("UP");
      }
    }, { passive: true });

    startBtn.addEventListener("click", () => {
      if (!isStarted || isGameOver) {
        startGame();
      } else {
        togglePause();
      }
    });

    overlayStartBtn.addEventListener("click", () => {
      if (isPaused) {
        togglePause();
        return;
      }

      if (isGameOver || !isStarted) {
        startGame();
      }
    });

    pauseBtn.addEventListener("click", () => {
      if (isStarted && !isGameOver) {
        togglePause();
      }
    });

    document.getElementById("restart").addEventListener("click", () => {
      resetGame();
      startGame();
    });

    resetGame();
    render();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
